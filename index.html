<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="description" content="moneroism" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>moneroism</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="progress" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
    <a class="nav-logo" href="#top" aria-label="top">
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#xmr" /></svg>
      <span>moneroism</span>
    </a>
    <nav>
      <a href="#about">about</a>
      <a href="#projects">projects</a>
      <a href="#contact">contact</a>
      <button class="term-btn" type="button" data-open-term title="terminal (press `)">&gt;_</button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-logo">
        <span class="orbit o1"></span>
        <span class="orbit o2"></span>
        <span class="orbit o3"></span>
        <svg class="coin" viewBox="0 0 100 100" role="img" aria-label="monero logo"><use href="#xmr" /></svg>
      </div>
      <h1 class="hero-title" data-split>moneroism</h1>
      <p class="hero-sub"><span class="prompt">$</span> <span id="typed"></span><span class="caret"></span></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="#projects">see projects</a>
        <button class="btn" type="button" data-open-term>open terminal</button>
      </div>
      <a class="scroll-hint" href="#about" aria-label="scroll down"><span></span></a>
    </section>

    <section id="about" class="section reveal">
      <h2 class="section-title"><span>01</span> <span class="t">about</span></h2>
      <div class="about-text" id="bio"></div>
    </section>

    <section id="projects" class="section reveal">
      <h2 class="section-title"><span>02</span> <span class="t">projects</span></h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="contact" class="section reveal">
      <h2 class="section-title"><span>03</span> <span class="t">contact</span></h2>
      <div class="contact" id="contact-body"></div>
    </section>
  </main>

  <footer class="footer">
    <p><a href="https://github.com/moneroism/moneroism.github.io" target="_blank" rel="noopener noreferrer">source</a> · GPL-3.0</p>
  </footer>

  <div class="dock" aria-label="effects">
    <button type="button" data-toggle="rain" title="monero rain">rain</button>
    <button type="button" data-toggle="trail" title="cursor trail">trail</button>
    <button type="button" data-miner title="definitely a real miner">⛏ mine</button>
    <button type="button" data-toggle="potato" title="turn off all effects">🥔 potato</button>
  </div>

  <div class="term" id="term" hidden>
    <div class="term-win" role="dialog" aria-label="terminal">
      <div class="term-head">
        <span class="dots"><i></i><i></i><i></i></span>
        <span>moneroism@xmr: ~</span>
        <button type="button" class="term-close" aria-label="close">×</button>
      </div>
      <div class="term-body" id="term-body">
        <div id="term-out"></div>
        <label class="term-line"><span class="term-ps">moneroism@xmr:~$</span><input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command" /></label>
      </div>
    </div>
  </div>

  <svg class="sprite" aria-hidden="true">
    <defs>
      <clipPath id="xmr-clip"><circle cx="50" cy="50" r="50" /></clipPath>
      <g id="xmr">
        <g clip-path="url(#xmr-clip)">
          <rect width="100" height="100" fill="#f26822" />
          <rect y="70" width="100" height="30" fill="#4c4c4c" />
          <path d="M15 70V24l35 35 35-35v46H72V51L50 73 28 51v19z" fill="#fff" />
        </g>
      </g>
    </defs>
  </svg>

  <noscript><p class="noscript">this page works without js, it just doesn't move. projects: <a href="https://github.com/moneroism">github.com/moneroism</a></p></noscript>
</body>
</html>
